version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars

  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
        - name: indent-error-flow
        - name: error-strings
        - name: context-as-argument
        - name: unexported-return

  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests may ignore errors that production code must not.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
